name: dbt build & publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'    # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true          # cache the uv virtualenv

      - name: Install dependencies
        run: uv sync

      - name: Download source data
        run: uv run python scripts/download_data.py

      - name: dbt build
        run: uv run dbt build --profiles-dir ../ci
        working-directory: analytics

      - name: Publish DuckDB warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it does not exist yet
          if ! gh release view warehouse > /dev/null 2>&1; then
            gh release create warehouse \
              --title "Warehouse" \
              --notes "Warehouse — auto-built by dbt" \
              --latest
          fi

          # Always overwrite the asset
          gh release upload warehouse data/prod.duckdb --clobber